name: Build A15 Zuma Pro Kernel SUSFS test Deepseek

on:
  workflow_dispatch:
  release:
    types: [published]
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release Name (e.g., Kernel Release v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        type: boolean
        default: false

jobs:
  build-kernel-a15-zumapro:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo apt install -y flex bison libssl-dev bc libelf-dev python3 unzip

      - name: Initialize Git Configuration
        run: |
          git config --global user.name "build"
          git config --global user.email "3436378798@qq.com"

      - name: Download and Extract GCC 14.2
        run: |
          GCC_URL="https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
          GCC_FILENAME="gcc-14.2.0.tar.xz"
          GCC_EXTRACT_DIR="gcc-14.2"
          wget "$GCC_URL" -O "$GCC_FILENAME"
          mkdir "$GCC_EXTRACT_DIR"
          tar -xf "$GCC_FILENAME" -C "$GCC_EXTRACT_DIR"
          echo "GCC_PATH=$(pwd)/$GCC_EXTRACT_DIR/bin" >> $GITHUB_ENV
          echo "GCC_TOOLCHAIN=$(pwd)/$GCC_EXTRACT_DIR" >> $GITHUB_ENV

      - name: Set Environment Variables
        run: |
          echo "CONFIG=android_kernel_google_zumapro" >> $GITHUB_ENV
          echo "ANYKERNEL_BRANCH=15.0.0-sultan-zumapro" >> $GITHUB_ENV
          echo "SUSFS_BRANCH=gki-android14-6.1" >> $GITHUB_ENV
          echo "PATH=$GCC_PATH:$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KCFLAGS=-march=armv8.6-a -O3 --param=min-pagesize=0" >> $GITHUB_ENV
          echo "LOCALVERSION=-Sultan-Cabage" >> $GITHUB_ENV

      - name: Clone Dependencies
        run: |
          git clone https://github.com/TheWildJames/AnyKernel3.git -b "${{ env.ANYKERNEL_BRANCH }}"
          # Verify AnyKernel3 structure
          cd AnyKernel3
          [ ! -f anykernel.sh ] && { echo "anykernel.sh missing!"; exit 1; }
          [ ! -d META-INF ] && { echo "META-INF directory missing!"; exit 1; }
          chmod +x anykernel.sh
          cd ..
          
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "${{ env.SUSFS_BRANCH }}"
          git clone https://github.com/TheWildJames/kernel_patches.git
          git clone https://github.com/cabagekiller/android_kernel_google_zumapro "${{ env.CONFIG }}"

          rm -rf /common/android/abi_gki_protected_exports_*

      - name: Add KernelSU
        run: |
          cd "${{ env.CONFIG }}"
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          cd KernelSU-Next/kernel
          KSU_VERSION=$(( $(git rev-list --count HEAD) + 10200 ))
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" Makefile
          cd ../..

      - name: Apply Patches
        run: |
          cd "${{ env.CONFIG }}"
           #Copy SUSFS patches
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU-Next/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cd ./KernelSU-Next

          echo "Applying SUSFS patches..."
          cp ../../kernel_patches/KernelSU-Next-Implement-SUSFS-v1.5.5-Universal.patch ./
          patch -p1 --forward < KernelSU-Next-Implement-SUSFS-v1.5.5-Universal.patch || true

          #Change to common directory and apply SUSFS patch
          cd ..
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true

          # Apply KSU Hooks, Hide Stuff, SUSFS Sultan Fixes
          cp ../kernel_patches/ksu_hooks.patch ./
          #patch -p1 --fuzz=3 < ./ksu_hooks.patch || true

          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < ./69_hide_stuff.patch || true

          cp ../kernel_patches/sys.c_fix.patch ./
          patch -p1 --fuzz=3 < ./sys.c_fix.patch || true
          cp ../kernel_patches/mount.h_fix.patch ./
          patch -p1 --fuzz=3 < ./mount.h_fix.patch || true
          cp ../kernel_patches/sched.h_fix.patch ./
          patch -p1 --fuzz=3 < ./sched.h_fix.patch || true
          cp ../kernel_patches/user.h_fix.patch ./
          patch -p1 --fuzz=3 < ./user.h_fix.patch || true
           git add -A && git commit -a -m "BUILD Kernel" || true
           git rm --cached KernelSU-Next

          # Fixes in SUSFS File
          sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c

          # Add SUSFS configuration options to defconfig
          cat <<EOF >> ./arch/arm64/configs/zumapro_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          EOF

          cat <<EOF >> ./arch/arm64/configs/defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          EOF

          # Set local version for kernel identification
          sed -i '/CONFIG_LOCALVERSION=.*/d' ./arch/arm64/configs/zumapro_defconfig
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCALVERSION }}\"" >> ./arch/arm64/configs/zumapro_defconfig

      - name: Verify Defconfig
        run: |
          cd "${{ env.CONFIG }}"
          if ! grep -q "CONFIG_MODULES=y" ./arch/arm64/configs/zumapro_defconfig; then
            echo "ERROR: CONFIG_MODULES is not enabled in zumapro_defconfig!"
            exit 1
          fi

      - name: Clean Build Directory
        run: |
          #cd "${{ env.CONFIG }}"
          #make mrproper
          #make zumapro_defconfig
      - name: Build the Kernel
        run: |
          cd "${{ env.CONFIG }}"
          echo "CONFIG_LTO_NONE=y" >> ./arch/arm64/configs/zumapro_defconfig
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make zumapro_defconfig
          make -j$(nproc --all) \
            CC="aarch64-linux-gnu-gcc" \
            LD="aarch64-linux-gnu-ld.bfd" \
            AR="aarch64-linux-gnu-ar" \
            NM="aarch64-linux-gnu-nm" \
            STRIP="aarch64-linux-gnu-strip" \
            KCFLAGS="${{ env.KCFLAGS }}"

          # Build device tree binaries
          make dtbs -j$(nproc --all)

          # Install modules (only if CONFIG_MODULES is enabled)
          if grep -q "CONFIG_MODULES=y" .config; then
            make modules_install INSTALL_MOD_PATH=modules_out
            mkdir -p ../AnyKernel3/modules
            find modules_out/ -name "*.ko" -exec cp {} ../AnyKernel3/modules/ \;
          else
            echo "Modules are disabled in kernel config, skipping modules_install"
            exit 1
          fi

      - name: Package Artifacts
        run: |
          cd "$CONFIG"
          mkdir -p ../AnyKernel3/kernel ../AnyKernel3/dtb
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/kernel/
          cp ./out/google-devices/zumapro/dts/*.dtb ../AnyKernel3/dtb/
          
          cd ../AnyKernel3
          ZIP_NAME="Cabage_SUSFS_Sultan_ZumaPro_${{ env.KSUVER }}-${{ github.run_id }}.zip"
          zip -r9 "../${ZIP_NAME}" ./*
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Verify ZIP Structure
        run: |
          cd ..
          unzip -l "$ZIP_NAME" | grep -E 'anykernel.sh|kernel/Image.lz4|dtb/.*\.dtb|modules/.*\.ko'
          if [ $? -ne 0 ]; then
            echo "ZIP file missing essential components!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zumapro
          path: ${{ env.ZIP_NAME }}
          compression-level: 1

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "Cabage_SUSFS_Sultan_ZumaPro_${{ env.KSUVER }}-${{ github.run_id }}"
          release_name: "Cabage_SUSFS_Sultan_ZumaPro Release ${{ env.KSUVER }}"
          draft: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip
