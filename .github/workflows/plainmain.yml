name: Build A15 Zuma Pro Kernel no SUSFS

on:
  workflow_dispatch:

jobs:
  build-kernel-a15-zumapro:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Installing dependencies
        run: |
          sudo apt update -y
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo apt install -y flex bison libssl-dev bc libelf-dev python3

      - name: Download and Extract GCC 14.2
        run: |
          # Replace with the actual URL of the GCC 14.2 prebuilt for aarch64-linux-gnu
          GCC_URL="https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"  # <-- **IMPORTANT:  REPLACE THIS URL**
          GCC_FILENAME="gcc-14.2.0.tar.xz"
          GCC_EXTRACT_DIR="gcc-14.2"

          wget "$GCC_URL" -O "$GCC_FILENAME"
          mkdir "$GCC_EXTRACT_DIR"
          tar -xf "$GCC_FILENAME" -C "$GCC_EXTRACT_DIR"

          echo "GCC_PATH=$(pwd)/$GCC_EXTRACT_DIR/bin" >> $GITHUB_ENV
          echo "GCC_TOOLCHAIN=$(pwd)/$GCC_EXTRACT_DIR" >> $GITHUB_ENV # Store for possible later usage

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_zumapro"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          echo "CONFIG set to: $CONFIG"

          # Crucial: Use the downloaded GCC toolchain
          echo "PATH=$GCC_PATH:$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV # Ensure the prefix is correct
          export PATH=$GCC_PATH:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          git clone https://github.com/kerneltoast/android_kernel_google_zumapro

      - name: Build the Kernel
        run: |
          cd "$CONFIG"
          
          # Create a config fragment (optional but recommended)
          cat << EOF > zumapro_config_fragment.cfg
          CONFIG_ARM_RME is not set
          CONFIG_KVM is not set
          CONFIG_HYPEVISOR_GUEST is not set
          EOF

          # Apply the config fragment (if you created one)
          # If you don't have a config fragment, just use the zumapro_defconfig
          # cat zumapro_config_fragment.cfg >> .config
          make zumapro_defconfig

          # Use a loop to robustly unset the config options
          for CONFIG_OPTION in CONFIG_ARM_RME CONFIG_KVM CONFIG_HYPEVISOR_GUEST; do
            scripts/kconfig/unset_config.sh "$CONFIG_OPTION" .config
          done

          # Verify the config (still important)
          grep CONFIG_ARM_RME .config
          grep CONFIG_KVM .config
          grep CONFIG_HYPEVISOR_GUEST .config

          # Ensure the GCC path is correct before running make
          export PATH="$GCC_PATH:$PATH"  # Set the GCC_PATH correctly
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j$(nproc --all) Image.lz4 dtbs # Build with correct GCC PATH

      - name: Package Artifacts
        run: |
          cd "$CONFIG"
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/
          cat ./out/google-modules/soc/gs/arch/arm64/boot/dts/google/*.dtb > ../AnyKernel3/dtb
          cd ../AnyKernel3
          zip -r9 "../A15_Sultan_ZumaPro.zip" ./*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zumapro
          path: |
            *.zip

