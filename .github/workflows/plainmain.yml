name: Build A15 Zuma Pro Kernel no SUSFS

on:
  workflow_dispatch:

jobs:
  build-kernel-a15-zumapro:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Installing dependencies
        run: |
          sudo apt update -y
          sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo apt install -y flex bison libssl-dev bc libelf-dev python3

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_zumapro"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          echo "CONFIG set to: $CONFIG"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          git clone https://github.com/kerneltoast/android_kernel_google_zumapro

      - name: Build the Kernel
        run: |
          cd "$CONFIG"
          
          # Robustly disable CONFIG_ARM_RME (and related options)
          sed -i 's|^CONFIG_ARM_RME=y$|# CONFIG_ARM_RME=n|' ./arch/arm64/configs/zumapro_defconfig  # Force disable RME

          # Disable other potential culprits (if you're not using virtualization)
          sed -i 's|^CONFIG_KVM=y$|# CONFIG_KVM=n|' ./arch/arm64/configs/zumapro_defconfig      # Disable KVM
          sed -i 's|^CONFIG_HYPEVISOR_GUEST=y$|# CONFIG_HYPEVISOR_GUEST=n|' ./arch/arm64/configs/zumapro_defconfig # Disable Hypervisor Guest

          # More aggressive disabling (if the above doesn't work)
          grep -q "CONFIG_ARM_RME=y" ./arch/arm64/configs/zumapro_defconfig && sed -i 's|CONFIG_ARM_RME=y|# CONFIG_ARM_RME=n|' ./arch/arm64/configs/zumapro_defconfig
          grep -q "CONFIG_KVM=y" ./arch/arm64/configs/zumapro_defconfig && sed -i 's|CONFIG_KVM=y|# CONFIG_KVM=n|' ./arch/arm64/configs/zumapro_defconfig
          grep -q "CONFIG_HYPEVISOR_GUEST=y" ./arch/arm64/configs/zumapro_defconfig && sed -i 's|CONFIG_HYPEVISOR_GUEST=y|# CONFIG_HYPEVISOR_GUEST=n|' ./arch/arm64/configs/zumapro_defconfig

          # Verify the config (important for debugging)
          grep CONFIG_ARM_RME ./arch/arm64/configs/zumapro_defconfig
          grep CONFIG_KVM ./arch/arm64/configs/zumapro_defconfig
          grep CONFIG_HYPEVISOR_GUEST ./arch/arm64/configs/zumapro_defconfig

          export PATH="/usr/bin:$PATH"
          mkdir -p out
          make zumapro_defconfig
          make -j$(nproc --all)

      - name: Package Artifacts
        run: |
          cd "$CONFIG"
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/
          cat ./out/google-modules/soc/gs/arch/arm64/boot/dts/google/*.dtb > ../AnyKernel3/dtb
          cd ../AnyKernel3
          zip -r9 "../A15_Sultan_ZumaPro.zip" ./*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zumapro
          path: |
            *.zip

